name: Maps API Playwright Automation CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to execute'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smoke
          - regression
      environment:
        description: 'Target Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - qa
          - staging

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  api-tests:
    name: Execute Playwright API Tests (${{ github.event.inputs.test_suite || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://rahulshettyacademy.com' }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || 'qaclick123' }}
      ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
      LOG_LEVEL: info
      WORKERS: 2
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: Linting & Code Quality Validation
        run: npm run lint

      - name: Format Verification
        run: npm run format:check

      - name: Execute Full API Suite
        if: "${{ github.event.inputs.test_suite == 'full' || github.event.inputs.test_suite == '' }}"
        run: npm run test:ci

      - name: Execute Smoke Suite
        if: "${{ github.event.inputs.test_suite == 'smoke' }}"
        run: npm run test:smoke -- --reporter=line,allure-playwright

      - name: Execute Regression Suite
        if: "${{ github.event.inputs.test_suite == 'regression' }}"
        run: npm run test:regression -- --reporter=line,allure-playwright

      - name: Setup Java (for Allure CLI)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev

      - name: Generate Allure Report
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report || echo "Allure generation skipped"

      - name: Generate Standalone Emailable HTML Report
        if: always()
        run: npm run report:emailable

      - name: Upload Emailable HTML Report (Shareable via Email)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emailable-html-report
          path: reports/
          retention-days: 30

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30
